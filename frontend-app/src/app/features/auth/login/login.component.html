<div class="auth-container">
  <!-- Premium Tech Grid & Parallax Background -->
  <div class="hero-tech-background">
    <!-- Cyber Grid Overlay -->
    <div class="hero-grid-overlay"></div>

    <!-- Ambient glows -->
    <div class="hero-glow-blob hero-blob-purple"></div>
    <div class="hero-glow-blob hero-blob-blue"></div>
    
    <!-- Floating Science & Math outline symbols -->
    <div class="floating-symbol sym-1">√x</div>
    <div class="floating-symbol sym-2">∫</div>
    <div class="floating-symbol sym-3">H₂O</div>
    <div class="floating-symbol sym-4">E=mc²</div>
    <div class="floating-symbol sym-5">y = mx + b</div>
    <div class="floating-symbol sym-6">sin(θ)</div>
    <div class="floating-symbol sym-7">CO₂</div>
    <div class="floating-symbol sym-8">F = m·a</div>
  </div>

  <div class="auth-box glass-card">
    <!-- Back button mejorado -->
    <button class="btn-back" routerLink="/">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Volver al Inicio
    </button>

    <div class="brand">
      <span class="text-gradient">EstudiaUni</span>.cl
    </div>
    <h1>Bienvenido de Vuelta</h1>
    <p class="subtitle">Continúa tu preparación PAES</p>
    
    <div *ngIf="error" class="error-banner">
      {{ error }}
    </div>

    <div *ngIf="resetSuccess" class="success-banner" style="background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; color: #10b981; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; text-align: center; font-size: 0.9rem;">
      ✅ Te hemos enviado un correo con instrucciones para restablecer tu contraseña.
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          [(ngModel)]="email" 
          name="email" 
          required 
          placeholder="tu@correo.com"
          class="glass-input"
        >
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="password-input-wrapper" style="position: relative;">
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            id="password" 
            [(ngModel)]="password" 
            name="password" 
            required 
            placeholder="••••••••"
            class="glass-input"
            style="padding-right: 2.5rem; width: 100%; box-sizing: border-box;"
          >
          <button type="button" class="btn-toggle-password" (click)="togglePasswordVisibility()" [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-secondary); padding: 0; display: flex;">
            <app-password-visibility-icon [passwordVisible]="showPassword"></app-password-visibility-icon>
          </button>
        </div>
        <div style="text-align: right; margin-top: 0.5rem;">
          <a href="javascript:void(0)" (click)="resetPassword()" class="forgot-password-link" style="color: var(--accent-primary); font-size: 0.85rem; text-decoration: none;">¿Olvidaste tu contraseña?</a>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-full" [disabled]="!loginForm.form.valid || loading">
        {{ loading ? 'Ingresando...' : 'Iniciar Sesión' }}
      </button>

      <div class="divider">
        <span>o continuar con</span>
      </div>

      <button type="button" class="btn btn-google w-full" (click)="loginWithGoogle()" [disabled]="loading">
        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continuar con Google
      </button>

      <div class="auth-links mt-4">
        <a routerLink="/register">¿Aún no tienes cuenta? Regístrate gratis</a>
      </div>
    </form>
  </div>
</div>
