<div class="auth-container">
  <div class="auth-box glass-card animate-fade-in">
    <!-- Back button -->
    <button class="btn-back" routerLink="/">
      ← Volver al Inicio
    </button>

    <div class="brand">
      <span class="text-gradient">EstudiaUni</span>.cl
    </div>
    <h2>Bienvenido de Vuelta</h2>
    <p class="subtitle">Continúa tu preparación PAES</p>
    
    <div *ngIf="error" class="error-banner">
      {{ error }}
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          [(ngModel)]="email" 
          name="email" 
          required 
          placeholder="tu@correo.com"
          class="glass-input"
        >
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          [(ngModel)]="password" 
          name="password" 
          required 
          placeholder="••••••••"
          class="glass-input"
        >
      </div>

      <button type="submit" class="btn btn-primary w-full" [disabled]="!loginForm.form.valid || loading">
        {{ loading ? 'Ingresando...' : 'Iniciar Sesión' }}
      </button>

      <div class="auth-links mt-4">
        <a routerLink="/register">¿Aún no tienes cuenta? Regístrate gratis</a>
      </div>
    </form>
  </div>
</div>
