<div class="auth-container">
  <div class="auth-box glass-card animate-fade-in">
    <!-- Back button -->
    <button class="btn-back" routerLink="/">
      ← Volver al Inicio
    </button>

    <div class="brand">
      <span class="text-gradient">EstudiaUni</span>.cl
    </div>
    <h2>Comienza Gratis</h2>
    <p class="subtitle">Crea tu cuenta y prepara la PAES</p>
    
    <div *ngIf="error" class="error-banner">
      {{ error }}
    </div>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
      <div class="form-group">
        <label for="name">Nombre Completo</label>
        <input 
          type="text" 
          id="name" 
          [(ngModel)]="name" 
          name="name" 
          required 
          placeholder="Tu nombre"
          class="glass-input"
        >
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          [(ngModel)]="email" 
          name="email" 
          required 
          placeholder="tu@correo.com"
          class="glass-input"
        >
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          [(ngModel)]="password" 
          name="password" 
          required 
          minlength="6"
          placeholder="Mínimo 6 caracteres"
          class="glass-input"
        >
      </div>

      <button type="submit" class="btn btn-primary w-full" [disabled]="!registerForm.form.valid || loading">
        {{ loading ? 'Creando cuenta...' : 'Crear Cuenta' }}
      </button>

      <div class="auth-links mt-4">
        <a routerLink="/login">¿Ya tienes cuenta? Inicia sesión</a>
      </div>
    </form>
  </div>
</div>
